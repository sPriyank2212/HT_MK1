name: ht_mk1_gui
description: HT_MK1 harness tester operator console — Flutter Windows desktop app.
publish_to: "none"
version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"

# Dependencies are kept to the bone. The Python GUI this replaces depends on
# nothing outside the standard library, and the same rule is worth keeping: an
# instrument console that can arm 500 V should not pull a dependency tree it
# cannot audit. Three exceptions:
#
# - flutter_libserialport. Dart has no serial API in dart:io, and the
#   instrument's link is a UART (LPUART1 -> ST-LINK VCP, 115200 8N1), so
#   talking to real hardware needs an FFI binding to libserialport. Used by
#   exactly one file, lib/htproto/serial_transport.dart, which nothing else
#   imports - so the protocol layer, the UI and the whole test suite stay free
#   of it.
# - file_picker. The native "open file" dialog for loading a netlist from
#   disk - no dart:io equivalent either. Used by exactly one file,
#   lib/htproto/netlist_picker_io.dart, injected into AppState the same way
#   serial ports are (see AppState.pickNetlistFile) - tests supply a fake and
#   never touch the platform channel.
# - excel. Pure Dart .xlsx reader (no native/platform code) for
#   lib/htproto/netlist_file.dart - operators have a real spreadsheet netlist
#   long before they have a harness to run cross-continuity discovery on.
dependencies:
  excel: ^4.0.6
  file_picker: ^11.0.3
  flutter:
    sdk: flutter
  flutter_libserialport: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: false
